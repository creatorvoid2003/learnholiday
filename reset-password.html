<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | LearnHoliday</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html">Learn<span>Holiday</span></a>
    <div class="header-actions"><a class="button button-outline" href="login.html">Log in</a></div>
  </header>
  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Reset your password</h1>
      <p>Enter your registered email address and we will send you a secure reset link.</p>
      <form id="password-reset-form">
        <label for="reset-email">Email address</label>
        <input id="reset-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button class="button button-primary button-full" type="submit">Send reset link</button>
      </form>
      <form id="new-password-form" style="margin-top:2rem">
        <h2>Choose a new password</h2>
        <p class="small-note">Open this page from the password reset email before setting your new password.</p>
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        <label for="confirm-new-password">Confirm new password</label>
        <input id="confirm-new-password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required>
        <button class="button button-primary button-full" type="submit">Update password</button>
      </form>
      <p id="password-reset-message" class="form-message" role="status" aria-live="polite"></p>
      <p class="auth-switch"><a href="login.html">Return to login</a></p>
    </section>
  </main>
  <footer class="site-footer"><p>© <span id="current-year">2026</span> LearnHoliday</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | LearnHoliday</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html">Learn<span>Holiday</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="study-centre.html">Study Centre</a>
      <a href="classroom.html">Classroom</a>
    </nav>
    <div class="header-actions">
      <a class="button button-outline" href="register.html">Create account</a>
    </div>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to LearnHoliday</h1>
      <p>Continue your learning journey.</p>

      <form id="login-form">
        <label for="login-email">Email address</label>
        <input
          id="login-email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button class="button button-primary button-full" type="submit">
          Log in
        </button>

        <p id="login-message" class="form-message" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Create one</a>
      </p>
      <a class="text-link" href="index.html">← Back to home</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="current-year">2026</span> LearnHoliday</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
